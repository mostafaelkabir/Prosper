name: Prosper
options:
  bundleIdPrefix: com.mostafa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: V9WJ9X99FX

targets:
  Prosper:
    type: application
    platform: iOS
    sources:
      - path: Prosper
      # Report views are compiled into the app too so the simulator and previews
      # can render them with sample data (the extension renders the real data).
      - path: ProsperReport/UsageSummary.swift
      - path: ProsperReport/UsageSummaryView.swift
      - path: ProsperReport/UsageIcon.swift
      - path: ProsperReport/TodayHeroReportView.swift
      - path: ProsperReport/HourlyUsage.swift
      - path: ProsperReport/HourlyHeatmapView.swift
      - path: ProsperReport/InsightEngine.swift
      - path: ProsperReport/InsightsReportView.swift
      - path: PrivacyManifests/Prosper/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Launch screen paints the app background (dynamic light/dark) instead of
        # system white, killing the cold-launch flash (QA-3).
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPhone only. Without this the bundle ships UIDeviceFamily [1,2] and
        # App Store validation demands the full iPad orientation set (90474) —
        # but nothing here has been designed or tested on iPad, and shipping an
        # untested iPad build is worse than not shipping one (REL-17).
        TARGETED_DEVICE_FAMILY: "1"
        # The App Store listing is StolenEyes ("Prosper" was taken), so the home
        # screen says StolenEyes too. A device name that disagrees with the store
        # name confuses users and risks Apple's metadata rules. "Prosper" stays
        # as the project/repo name only.
        INFOPLIST_KEY_CFBundleDisplayName: StolenEyes
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: Prosper/Prosper.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    dependencies:
      - target: ProsperMonitor
      - target: ProsperShield
      - target: ProsperShieldAction
      - target: ProsperReport
    scheme:
      testTargets:
        - ProsperTests

  # Covers the pure logic that ships silently: BlockDomain.normalize, where a
  # wrong answer means a site the user believes is blocked simply is not, and
  # the WarningLevel ladder maths (REL-15).
  ProsperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProsperTests
    dependencies:
      - target: Prosper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.tests
        GENERATE_INFOPLIST_FILE: YES

  ProsperMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ProsperMonitor
      - path: Prosper/Models
      - path: Prosper/Services/PersistenceConfig.swift
      # Warning ladder + pending-intervention flag are shared with the app.
      - path: Prosper/Services/WarningEscalation.swift
      # The active-block snapshot, so the monitor can sweep a block that has
      # outlived its timer without opening SwiftData (REL-7).
      - path: Prosper/Services/SharedBlockState.swift
      - path: PrivacyManifests/ProsperMonitor/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.monitor
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: ProsperMonitor/ProsperMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    info:
      path: ProsperMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivitymonitor
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProsperDeviceActivityMonitor

  ProsperShield:
    type: app-extension
    platform: iOS
    sources:
      - path: ProsperShield
      - path: Prosper/Services/SharedBlockState.swift
      # One source for the "deleting Prosper ends a block" line (REL-8).
      - path: Prosper/Services/LockExitCopy.swift
      - path: PrivacyManifests/ProsperShield/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.shield
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: ProsperShield/ProsperShield.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    info:
      path: ProsperShield/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.shieldconfiguration
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProsperShieldConfiguration

  ProsperShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ProsperShieldAction
      - path: PrivacyManifests/ProsperShieldAction/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.shieldaction
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    # Matches ProsperShield, the other ManagedSettingsUI extension, which ships
    # with the App Group and no family-controls entitlement. The App Group is
    # what E7.7 needs to count block attempts. If DEV-1 shows shield actions
    # misbehaving on device, add com.apple.developer.family-controls here and
    # extend the REL-1 request to com.mostafa.prosper.shieldaction (REL-16).
    entitlements:
      path: ProsperShieldAction/ProsperShieldAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    info:
      path: ProsperShieldAction/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.shieldaction
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProsperShieldActionExtension

  ProsperReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ProsperReport
      - path: Prosper/Extensions/ReportContext.swift
      - path: Prosper/DesignSystem
      - path: Prosper/Services/SharedClassification.swift
      - path: Prosper/Services/PlatformCatalog.swift
      - path: PrivacyManifests/ProsperReport/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.report
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: ProsperReport/ProsperReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    info:
      path: ProsperReport/Info.plist
      properties:
        # Required by App Store validation for this extension; without it the
        # upload is rejected with 90360 (REL-17).
        CFBundleDisplayName: StolenEyes
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
