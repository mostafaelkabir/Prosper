name: Prosper
options:
  bundleIdPrefix: com.mostafa
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: V9WJ9X99FX

# Shared core (M0.1). The Mac targets link it; the iOS targets compile the same
# files by path so the iOS binary is built exactly as before (docs/mac/PLAN.md §3.7).
packages:
  ProsperCore:
    path: Packages/ProsperCore

targets:
  Prosper:
    type: application
    platform: iOS
    sources:
      - path: Prosper
      # Shared with the Mac (ProsperCore); compiled by path so the iOS build
      # gains no new dependency (PLAN.md §3.7, SC4).
      - path: Packages/ProsperCore/Sources/ProsperCore/Shared
      # Report views are compiled into the app too so the simulator and previews
      # can render them with sample data (the extension renders the real data).
      - path: ProsperReport/UsageSummary.swift
      - path: ProsperReport/UsageSummaryView.swift
      - path: ProsperReport/UsageIcon.swift
      - path: ProsperReport/TodayHeroReportView.swift
      - path: ProsperReport/HourlyUsage.swift
      - path: ProsperReport/HourlyHeatmapView.swift
      - path: ProsperReport/InsightEngine.swift
      - path: ProsperReport/InsightsReportView.swift
      - path: PrivacyManifests/Prosper/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Launch screen paints the app background (dynamic light/dark) instead of
        # system white, killing the cold-launch flash (QA-3). It lives in a
        # partial Info.plist merged with the generated one: the build setting
        # used before (INFOPLIST_KEY_UILaunchScreen_BackgroundColor) does not
        # exist, so the shipped UILaunchScreen was empty and every cold launch
        # still flashed white (QA-9).
        INFOPLIST_FILE: Prosper/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPhone only. Without this the bundle ships UIDeviceFamily [1,2] and
        # App Store validation demands the full iPad orientation set (90474) —
        # but nothing here has been designed or tested on iPad, and shipping an
        # untested iPad build is worse than not shipping one (REL-17).
        TARGETED_DEVICE_FAMILY: "1"
        # The App Store listing is StolenEyes ("Prosper" was taken), so the home
        # screen says StolenEyes too. A device name that disagrees with the store
        # name confuses users and risks Apple's metadata rules. "Prosper" stays
        # as the project/repo name only.
        INFOPLIST_KEY_CFBundleDisplayName: StolenEyes
        # Export compliance, answered once here instead of per-build in App Store
        # Connect. StolenEyes makes no network requests at all — no backend, no
        # analytics, no third-party SDKs — so it uses no non-exempt encryption.
        # Without this key every upload lands as MISSING_EXPORT_COMPLIANCE and
        # cannot be given to testers until someone clicks through the question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: Prosper/Prosper.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    dependencies:
      - target: ProsperMonitor
      - target: ProsperShield
      - target: ProsperShieldAction
      - target: ProsperReport
    scheme:
      testTargets:
        - ProsperTests

  # Covers the pure logic that ships silently: BlockDomain.normalize, where a
  # wrong answer means a site the user believes is blocked simply is not, and
  # the WarningLevel ladder maths (REL-15).
  ProsperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProsperTests
    dependencies:
      - target: Prosper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.tests
        GENERATE_INFOPLIST_FILE: YES

  ProsperMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ProsperMonitor
      - path: Prosper/Models
      - path: Packages/ProsperCore/Sources/ProsperCore/Shared
      - path: Prosper/Services/PersistenceConfig.swift
      # Warning ladder + pending-intervention flag are shared with the app.
      - path: Prosper/Services/WarningEscalation.swift
      # The active-block snapshot, so the monitor can sweep a block that has
      # outlived its timer without opening SwiftData (REL-7).
      - path: Prosper/Services/SharedBlockState.swift
      # The unblock timers, so an interval that ends early (time-zone change,
      # DST) is re-armed from here instead of lifting the block (QA-9).
      - path: Prosper/Services/UnblockSchedule.swift
      # Scheduled locks are switched on and off from here (E3.6).
      - path: Prosper/Services/ScheduledLock.swift
      # Schedules build their web filter policy with the same helper as the
      # app (E9).
      - path: Prosper/Services/AdultDomainList.swift
      - path: PrivacyManifests/ProsperMonitor/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.monitor
        # Must match the app; an extension claiming iPad while the app is
        # iPhone-only is an inconsistent bundle (REL-17).
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: ProsperMonitor/ProsperMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    info:
      path: ProsperMonitor/Info.plist
      properties:
        CFBundleDisplayName: StolenEyes
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProsperDeviceActivityMonitor

  ProsperShield:
    type: app-extension
    platform: iOS
    sources:
      - path: ProsperShield
      - path: Prosper/Services/SharedBlockState.swift
      # One source for the "deleting Prosper ends a block" line (REL-8), in
      # ProsperCore's shared files.
      - path: Packages/ProsperCore/Sources/ProsperCore/Shared
      # The Adult Content Guard's record, so a guarded app gets the guard's
      # words instead of a block's countdown (E9).
      - path: Prosper/Services/SharedGuardState.swift
      - path: PrivacyManifests/ProsperShield/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.shield
        # Must match the app; an extension claiming iPad while the app is
        # iPhone-only is an inconsistent bundle (REL-17).
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: ProsperShield/ProsperShield.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    info:
      path: ProsperShield/Info.plist
      properties:
        CFBundleDisplayName: StolenEyes
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProsperShieldConfiguration

  ProsperShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ProsperShieldAction
      - path: PrivacyManifests/ProsperShieldAction/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.shieldaction
        # Must match the app; an extension claiming iPad while the app is
        # iPhone-only is an inconsistent bundle (REL-17).
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    # Matches ProsperShield, the other ManagedSettingsUI extension, which ships
    # with the App Group and no family-controls entitlement. The App Group is
    # what E7.7 needs to count block attempts. If DEV-1 shows shield actions
    # misbehaving on device, add com.apple.developer.family-controls here and
    # extend the REL-1 request to com.mostafa.prosper.shieldaction (REL-16).
    entitlements:
      path: ProsperShieldAction/ProsperShieldAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    info:
      path: ProsperShieldAction/Info.plist
      properties:
        CFBundleDisplayName: StolenEyes
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProsperShieldActionExtension

  ProsperReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ProsperReport
      - path: Prosper/Extensions/ReportContext.swift
      - path: Prosper/DesignSystem
      - path: Prosper/Services/SharedClassification.swift
      - path: Packages/ProsperCore/Sources/ProsperCore/Shared
      - path: PrivacyManifests/ProsperReport/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.report
        # Must match the app; an extension claiming iPad while the app is
        # iPhone-only is an inconsistent bundle (REL-17).
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: ProsperReport/ProsperReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.mostafa.prosper
    info:
      path: ProsperReport/Info.plist
      properties:
        # Required by App Store validation for this extension; without it the
        # upload is rejected with 90360 (REL-17).
        CFBundleDisplayName: StolenEyes
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension

  # ── Mac (docs/mac/PLAN.md) ─────────────────────────────────────────────────
  # The app is the UI only: it never enforces anything. The agent (a KeepAlive
  # launchd agent inside the bundle) measures, quits blocked apps and keeps the
  # rules; the system extension filters every network flow and DNS query.
  ProsperMac:
    type: application
    platform: macOS
    sources:
      - path: ProsperMac
        excludes:
          - LaunchAgents
      # The Aurora components are pure SwiftUI and shared with the iPhone app.
      - path: Prosper/DesignSystem/AuroraComponents.swift
      - path: Prosper/DesignSystem/ProsperComponents.swift
      - path: ProsperMac/LaunchAgents/com.mostafa.prosper.mac.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: ProsperCore
      - target: ProsperMacAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      - target: ProsperMacFilter
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: StolenEyes
        PRODUCT_MODULE_NAME: ProsperMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.mac
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StolenEyes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # macOS holds the app responsible for the helper it launches, so the
        # consent prompts for the helper's Apple Events and screen capture are
        # checked against these too. Without them Chrome refused silently.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: StolenEyes reads the address of the browser tab you are on to count time per website and to close a tab on a blocked site. Only the site name is kept, never the page.
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: While the Adult Content Guard is on, StolenEyes checks the window in front for explicit images on this Mac, with Apple's on-device classifier. Frames are never saved or sent anywhere.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1
    entitlements:
      path: ProsperMac/ProsperMac.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - content-filter-provider-systemextension
          - dns-proxy-systemextension
        com.apple.developer.system-extension.install: true
        com.apple.security.automation.apple-events: true
        com.apple.security.application-groups:
          - V9WJ9X99FX.com.mostafa.prosper.mac
    scheme:
      testTargets:
        - ProsperMacTests

  ProsperMacAgent:
    type: application
    platform: macOS
    sources:
      - path: ProsperMacAgent
    dependencies:
      - package: ProsperCore
    settings:
      base:
        PRODUCT_NAME: StolenEyesAgent
        PRODUCT_MODULE_NAME: ProsperMacAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.mac.agent
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StolenEyes Agent
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: While the Adult Content Guard is on, StolenEyes checks the window in front for explicit images on this Mac, with Apple's on-device classifier. Frames are never saved or sent anywhere.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: StolenEyes reads the address of the browser tab you are on to count time per website and to close a tab on a blocked site. Only the site name is kept, never the page.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1
        SKIP_INSTALL: YES
    entitlements:
      path: ProsperMacAgent/ProsperMacAgent.entitlements
      properties:
        com.apple.security.application-groups:
          - V9WJ9X99FX.com.mostafa.prosper.mac
        com.apple.security.automation.apple-events: true
        # Screen Guard (M2.3): Apple's on-device nudity classifier.
        com.apple.developer.sensitivecontentanalysis.client:
          - analysis

  ProsperMacFilter:
    type: system-extension
    platform: macOS
    sources:
      - path: ProsperMacFilter
    dependencies:
      - package: ProsperCore
    settings:
      base:
        # A system extension's bundle must be named after its identifier.
        PRODUCT_NAME: com.mostafa.prosper.mac.filter
        PRODUCT_MODULE_NAME: ProsperMacFilter
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.mac.filter
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1
        SKIP_INSTALL: YES
    entitlements:
      path: ProsperMacFilter/ProsperMacFilter.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - content-filter-provider-systemextension
          - dns-proxy-systemextension
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          - V9WJ9X99FX.com.mostafa.prosper.mac
    info:
      path: ProsperMacFilter/Info.plist
      properties:
        CFBundleDisplayName: StolenEyes Filter
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSystemExtensionUsageDescription: StolenEyes uses this to block the websites you choose and adult content, in every browser.
        NetworkExtension:
          NEMachServiceName: V9WJ9X99FX.com.mostafa.prosper.mac.filter
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
            com.apple.networkextension.dns-proxy: $(PRODUCT_MODULE_NAME).DNSProxyProvider

  ProsperMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ProsperMacTests
    dependencies:
      - package: ProsperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
