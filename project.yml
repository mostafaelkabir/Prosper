name: Prosper
options:
  bundleIdPrefix: com.mostafa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""

targets:
  Prosper:
    type: application
    platform: iOS
    sources:
      - path: Prosper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: Prosper/Prosper.entitlements
      properties:
        com.apple.developer.family-controls: true
    dependencies:
      - target: ProsperMonitor
      - target: ProsperShield
      - target: ProsperShieldAction

  ProsperMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ProsperMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.monitor
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: ProsperMonitor/ProsperMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: ProsperMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivitymonitor
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProsperDeviceActivityMonitor

  ProsperShield:
    type: app-extension
    platform: iOS
    sources:
      - path: ProsperShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.shield
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    info:
      path: ProsperShield/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.shieldconfiguration
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProsperShieldConfiguration

  ProsperShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ProsperShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mostafa.prosper.shieldaction
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    info:
      path: ProsperShieldAction/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.shieldaction
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProsperShieldActionExtension
